schema_version = "1.4"

[task]
name = "ezra-samples/webshop-incident-response"
description = "Investigate, report, and remediate a breach on a frozen snapshot of a compromised Flask web host."
keywords = ["security", "incident-response", "dfir", "forensics", "blue-team", "remediation"]

[metadata]
difficulty = "hard"
category = "security-incident-response"
oracle_reward_threshold = 1.0

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
# The verifier only reads files and re-scans /app/host with stdlib Python; a real
# run finishes in a few seconds. 600s is ~100x headroom and also covers the
# internal soft deadline (DEADLINE_SEC=600 in grade.py).
timeout_sec = 600.0

[verifier.env]
IR_SEED = "20261029"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
